# Local deployment blueprint only. Do not import, link or apply this file until
# the user has switched Render accounts and explicitly authorized deployment.
# Blueprint creation starts an initial deployment even with auto-deploy off.
services:
  - type: web
    name: fieldsync-api
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    # Free web services have no pre-deploy hook. Migrate before either runtime starts.
    startCommand: npm run db:migrate && npm run start --workspace=@fieldsync/server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      - key: SERVE_WEB
        value: "true"
      - key: RUN_INLINE_WORKER
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: APP_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: AUTH_RATE_LIMIT
        value: "60"
      - key: DATABASE_URL
        fromDatabase: { name: fieldsync-db, property: connectionString }
      # Render's same-region private URL uses a self-signed certificate.
      # Verified external TLS is an alternative documented in docs/DEPLOYMENT.md.
      - key: POSTGRES_SSL
        value: "false"
      - key: REDIS_URL
        fromService: { name: fieldsync-queue, type: keyvalue, property: connectionString }
      - key: QUEUE_PREFIX
        value: fieldsync-production
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_RATE_LIMIT
        value: "10"
      - key: AI_MAX_PER_HOUR
        value: "20"

  - type: keyvalue
    name: fieldsync-queue
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: fieldsync-db
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    databaseName: fieldsync
    user: fieldsync
    ipAllowList: []
