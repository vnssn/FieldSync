# Existing Render API/Redis topology. Update the existing service during cutover;
# do not import this Blueprint to create a second backend or database.
# Keep frontend serving enabled until Vercel passes live browser acceptance.
services:
  - type: web
    name: fieldsync-api
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    # Free web services have no pre-deploy hook. Migrate before either runtime starts.
    startCommand: npm run db:migrate && npm run start --workspace=@fieldsync/server
    # Process probes must not prevent Neon from suspending while the site is idle.
    healthCheckPath: /api/v1/live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      - key: SERVE_WEB
        value: "true"
      - key: RUN_INLINE_WORKER
        value: "true"
      - key: JOBS_IDLE_INTERVAL_MS
        value: "1800000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: APP_ORIGIN
        sync: false
      - key: ADDITIONAL_APP_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: AUTH_RATE_LIMIT
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATIONS_DATABASE_URL
        sync: false
      # Neon requires TLS. The app verifies the provider certificate.
      - key: POSTGRES_SSL
        value: "true"
      - key: REDIS_URL
        fromService: { name: fieldsync-queue, type: keyvalue, property: connectionString }
      - key: QUEUE_PREFIX
        value: fieldsync-production
      - key: EVIDENCE_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_RATE_LIMIT
        value: "10"
      - key: AI_MAX_PER_HOUR
        value: "20"

  - type: keyvalue
    name: fieldsync-queue
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
